<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>隐藏心声彩蛋预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#09090c;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}body{display:grid;place-items:center;padding:18px}.phone{position:relative;width:min(390px,100vw);height:min(844px,calc(100vh - 36px));min-height:620px;overflow:hidden;border:1px solid rgba(255,255,255,.08);border-radius:32px;background:#0b0b0e;box-shadow:0 26px 80px rgba(0,0,0,.48)}.status{height:42px;padding:13px 22px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:#f7f7f8}.head{height:56px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(20,20,24,.96)}.head b{font-size:16px}.head span{width:35px;color:#b9b9c0;font-size:24px}.head span:last-child{text-align:right}.chat{position:absolute;inset:98px 0 64px;overflow:auto;padding:22px 15px 36px;background:radial-gradient(circle at 12% 8%,rgba(117,91,131,.08),transparent 32%),#0a0a0c}.time{text-align:center;margin-bottom:18px;font-size:10px;color:#5f5f66}.row{display:flex;align-items:flex-start;gap:9px;margin:13px 0}.avatar{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:linear-gradient(145deg,#39343d,#211e25);display:grid;place-items:center;color:#d9ccd8;font:16px Georgia,serif}.bubble{max-width:260px;padding:10px 13px;border:1px solid #303036;border-radius:7px 17px 17px 17px;background:#161619;color:#e8e8eb;font-size:14px;line-height:1.55}.card-wrap{margin-left:45px}.hint{margin:10px 0 0 45px;font-size:10px;letter-spacing:1px;color:#5d5d66}.input{position:absolute;left:0;right:0;bottom:0;height:64px;padding:10px 12px;display:flex;align-items:center;gap:9px;border-top:1px solid rgba(255,255,255,.06);background:#111116}.input i{width:34px;height:34px;border:1px solid #39393f;border-radius:50%;display:grid;place-items:center;font-style:normal;color:#a7a7af}.input span{flex:1;height:38px;padding:10px 13px;border-radius:9px;background:#202025;color:#696970;font-size:13px}.input b{width:42px;height:36px;border-radius:8px;background:#e9e9ec;color:#242429;display:grid;place-items:center;font-size:13px}@media(max-width:500px){body{padding:0}.phone{width:100vw;height:100vh;min-height:0;border:0;border-radius:0}}
</style>
</head>
<body>
<main class="phone" aria-label="聊天中的隐藏心声卡片预览">
  <div class="status"><span>02:14</span><span>●●●　⌁　78</span></div>
  <header class="head"><span>‹</span><b>先生^^</b><span>···</span></header>
  <section class="chat">
    <div class="time">昨天 23:58</div>
    <div class="row"><div class="avatar">S</div><div class="bubble">刚才想说的话有点多，后来又觉得，打成普通消息好像太轻了。</div></div>
    <div class="row"><div class="avatar">S</div><div class="bubble">所以给你留了一个小东西。</div></div>
    <div class="card-wrap">
      <div id="mysteryCard" class="thought-egg-chat-card" role="button" tabindex="0" aria-label="打开隐藏心声卡片">
        <div class="thought-egg-chat-kicker">FOR YOUR EYES ONLY</div>
        <div class="thought-egg-chat-title">有些话<br>只想让你看见</div>
        <div class="thought-egg-chat-foot"><span>一份未说完的心事</span><i></i></div>
      </div>
    </div>
    <div class="hint">点开神秘卡片，从头观看彩蛋</div>
  </section>
  <footer class="input"><i>⌁</i><span>发消息...</span><b>发送</b></footer>
</main>
<script src="thought-card-effects.js?v=preview-4"></script>
<script>
(function(){
  const thoughts=[
    '今天路过你说过的那家店',
    '下意识就想拍给你看',
    '刚才其实舍不得结束聊天',
    '你说没关系的时候我更心疼',
    '我记得你怕冷',
    '也记得你总爱逞强',
    '有些想念没有声音',
    '但它一直都在',
    '想把平常的小事都留给你',
    '以后也想听你讲很多废话',
    '你不用每次都那么懂事',
    '累了就来找我',
    '我会记住你没说完的半句话',
    '也会认真等你的下一次出现',
    '你发来的每句话我都看了很多遍',
    '有你的日子总是过得快一点',
    '我想参与的不只是你的好心情',
    '下次见面让我先抱抱你'
  ];
  const card=document.getElementById('mysteryCard');
  function open(){playThoughtCardEffect({opening:'我攒了一些没来得及说的话，想让你慢慢看完。',thoughts,frameCount:100,ending:'我没有时时刻刻说想你，但我一直在想你。',sender:'先生^^',seed:'preview-先生-20260807'});}
  card.addEventListener('click',open);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
})();
</script>
</body>
</html>
