<!doctype html>
<html lang="zh-CN" data-admin-portal="owner">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="North 总后台">
  <title>North 主管理员总后台</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icon.png">
  <style>
    :root{color-scheme:dark;--bg:#0d0e10;--panel:#17181c;--line:#2b2d33;--text:#f4f4f5;--muted:#92959d;--pink:#f28bb1;--green:#42c889;--red:#ef6a73}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:0}
    button,input,textarea,select{font:inherit;letter-spacing:0}button{cursor:pointer}.hidden{display:none!important}
    .shell{max-width:920px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px)}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 14px;border-bottom:1px solid var(--line)}
    h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.tools{display:flex;gap:8px;align-items:center}
    .icon,.btn{border:1px solid var(--line);background:#1b1c20;color:var(--text);border-radius:8px;min-height:42px;padding:0 14px}.icon{width:42px;padding:0;font-size:20px}
    .btn.primary{background:var(--pink);border-color:var(--pink);color:#171014;font-weight:700}.btn.approve{background:var(--green);border-color:var(--green);color:#07150e;font-weight:700}.btn.danger{color:#ffadb2;border-color:#65343a}
    .auth{max-width:440px;margin:14vh auto 0}.auth h2{font-size:28px;margin:0 0 8px}.auth p{color:var(--muted);line-height:1.7;margin:0 0 20px}
    .auth-modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 12px}.auth-mode{border:1px solid var(--line);background:#17181c;color:var(--muted);border-radius:8px;min-height:44px;padding:0 10px}.auth-mode.on{border-color:var(--pink);color:var(--text);background:#2a2025}
    .field{display:block;margin:12px 0}.field span{display:block;color:#b8bbc2;font-size:13px;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#17181c;color:var(--text);border-radius:8px;padding:12px;outline:0}.field input:focus,.field textarea:focus{border-color:#8b6675}.field textarea{min-height:90px;resize:vertical}
    .tabs{display:flex;gap:8px;padding:14px 0 12px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-bottom:2px solid transparent}.tab.on{color:var(--text);border-color:var(--pink)}
    .count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#3a2930;color:#ffc3d8;font-size:11px;margin-left:5px}
    .status{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;padding:0 2px 10px}.orders{display:grid;gap:10px}
    .order{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}.order.pending{border-color:#725064}
    .order-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.order-title{font-size:17px;font-weight:700}.order-state{font-size:12px;color:var(--muted);white-space:nowrap}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:12px 0;color:#c9cbd0;font-size:13px}.meta b{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-bottom:3px}.proof{width:100%;max-height:360px;object-fit:contain;background:#09090a;border:1px solid var(--line);border-radius:8px;display:block}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions .btn{flex:1 1 140px}
    .fold-head{display:flex;align-items:center;gap:9px;min-width:0;flex:1;border:0;background:transparent;color:var(--text);padding:0;text-align:left}.fold-icon{display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;color:#d7d9df;font-size:19px}.fold-main{display:grid;gap:2px;min-width:0}.fold-main .sub,.fold-main .order-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.order-body{padding-top:2px}.proof-btn{border:0;background:transparent;padding:0;width:100%;display:block}.wide-hit{min-height:48px}
    .empty{padding:18vh 16px;text-align:center;color:var(--muted)}.spinner{width:20px;height:20px;border:2px solid #3b3d44;border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:end center;padding:18px;z-index:20}.sheet{width:min(100%,520px);background:#191a1e;border:1px solid var(--line);border-radius:8px;padding:16px;max-height:88vh;overflow:auto}.sheet h2{font-size:19px;margin:0 0 8px}.sheet p{color:var(--muted);font-size:13px;line-height:1.6}.sheet-actions{display:flex;gap:8px;margin-top:14px}.sheet-actions .btn{flex:1}
    .viewer{position:fixed;inset:0;background:#000;z-index:30;display:grid;place-items:center;padding:16px}.viewer img{max-width:100%;max-height:92vh;object-fit:contain}.viewer button{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px}
    .install-tip{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}
    .license-tools{display:flex;gap:8px;margin:2px 0 12px}.license-tools input{flex:1;min-width:180px}.license-tools input,.license-tools select{border:1px solid var(--line);background:#17181c;color:var(--text);border-radius:8px;padding:12px;outline:0}.license-tools input:focus,.license-tools select:focus{border-color:#8b6675}.license-tools select{min-width:112px}
    .license-id{font-size:18px;font-weight:800;letter-spacing:.8px}.license-state{font-size:12px;padding:4px 8px;border-radius:999px;background:#153322;color:#8ce2ad}.license-state.blocked{background:#3a2023;color:#ffadb2}
    .license-summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 2px 12px}.license-pager{display:flex;justify-content:center;align-items:center;gap:10px;padding:16px 0 2px}.license-pager .btn{min-width:88px}.license-pager .btn:disabled{opacity:.42;cursor:default}.license-page{min-width:110px;text-align:center;color:var(--muted);font-size:13px}
    @media(max-width:560px){.shell{padding-left:10px;padding-right:10px}.meta{grid-template-columns:1fr}.order{padding:12px}.tools .btn{padding:0 10px}.hide-mobile{display:none}.license-tools{flex-wrap:wrap}.license-tools input{flex-basis:100%}.license-tools select{flex:1}.license-summary{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <section id="auth" class="auth">
      <h2>主管理员总后台</h2>
      <p id="authHint">这是主管理员专用地址。已绑定的设备会直接进入；新设备只需输入一次由已登录设备生成的临时绑定码，不使用邀请码或长期口令。</p>
      <label class="field"><span id="adminTokenLabel">一次性设备绑定码</span><input id="adminToken" type="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="20" placeholder="在已登录设备中生成"></label>
      <button class="btn primary" style="width:100%" id="loginBtn">绑定并进入总后台</button>
      <div class="install-tip">建议先在浏览器进入总后台，再添加到手机主屏幕。iPhone 会把当前登录状态一并带入。</div>
    </section>

    <section id="workspace" class="hidden">
      <header>
        <div><h1>North 管理后台</h1><div class="sub">付款核对与用户授权</div></div>
        <div class="tools">
          <button class="btn" id="installBtn">安装</button>
          <button class="btn" id="ownerPairBtn" data-owner-only>绑定新设备</button>
          <button class="btn" id="notifyBtn" data-owner-only>通知</button>
          <button class="icon" id="refreshBtn" title="刷新" aria-label="刷新">↻</button>
        </div>
      </header>
      <nav class="tabs">
        <button class="tab on" data-scope="pending" data-owner-only>待核对 <span class="count" id="pendingCount">0</span></button>
        <button class="tab" data-scope="all" data-owner-only>全部订单</button>
        <button class="tab" id="licenseTab">新授权项目 <span class="count" id="licenseCount">0</span></button>
      </nav>
      <div class="status"><span id="statusText">准备加载</span><span style="display:flex;gap:8px;align-items:center"><button class="tab" id="deleteAllBtn" data-owner-only>清空订单</button><button class="tab" id="logoutBtn">退出授权</button></span></div>
      <section id="orders" class="orders"></section>
      <section id="licensePanel" class="hidden">
        <div class="license-tools">
          <input id="licenseSearch" inputmode="text" autocomplete="off" placeholder="搜索小手机 ID、AI 用户 ID、完整邀请码或授权编号">
          <select id="licenseStatus" aria-label="授权状态">
            <option value="all">全部状态</option>
            <option value="active">可进入</option>
            <option value="blocked">已移出</option>
          </select>
          <button class="btn" id="licenseRefreshBtn">刷新</button>
          <button class="btn approve" id="licenseGenerateBtn">生成新版邀请码</button>
          <button class="btn" id="licenseListInvitesBtn">查询未使用邀请码</button>
          <button class="btn approve" id="licenseRestoreAllBtn">一键放回异常授权</button>
        </div>
        <div class="license-summary sub"><span>这里显示新授权项目中的用户，不代表旧项目历史总人数，每页只读取50人。旧库恢复后会去重迁入；完整邀请码可查询已迁入的使用者。</span><span id="licenseResultText">准备读取新项目用户</span></div>
        <section id="licenseUsers" class="orders"></section>
        <div class="license-pager">
          <button class="btn" id="licensePrevBtn">上一页</button>
          <span class="license-page" id="licensePageText">第 1 / 1 页</span>
          <button class="btn" id="licenseNextBtn">下一页</button>
        </div>
      </section>
    </section>
  </main>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="viewer" class="viewer hidden"><button class="icon" id="closeViewer" aria-label="关闭">×</button><img id="viewerImg" alt="付款截图大图"></div>
  <script src="../admin/app.js?v=641"></script>
</body>
</html>
