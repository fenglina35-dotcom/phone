:root{--north-clock-font:"North Stencil Clock",Impact,"Arial Black",sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
button,.btn,.minibtn,.send,.plus,.app,.list .row,.tabbar .tb,.nav .l,.nav .r,.panel .it,.card,.sw,.it,.pfswipe{touch-action:manipulation;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#ffd6e8,#d6e4ff 50%,#e3d6ff);display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:12px;}
.phone{position:relative;width:380px;height:800px;max-height:97vh;background:#111;border-radius:48px;padding:12px;box-shadow:0 20px 60px rgba(255,143,171,.45);}
.screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;background:#ededed;}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:108px;height:26px;background:#000;border-radius:16px;z-index:99;}
.statusbar{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:600;color:#fff;z-index:5;}
.statusbar.dark{color:#111;}
#app{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.page{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;}
/* 顶栏 */
.nav{flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#ededed;border-bottom:.5px solid #dadada;position:relative;z-index:20;}
.nav .t{font-size:17px;font-weight:600;color:#111;position:absolute;left:50%;transform:translateX(-50%);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav .l,.nav .r{font-size:22px;color:#111;cursor:pointer;min-width:44px;min-height:44px;display:flex;align-items:center;position:relative;z-index:5;}
.nav .r{justify-content:flex-end;}
.nav .l{font-size:25px;}
/* 主屏幕 */
.home{background:linear-gradient(160deg,#ffc8dd,#bde0fe 55%,#cdb4db);height:100%;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;}
.home,.home *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.home-scroll{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;}
.home .clockw{color:#fff;text-align:center;margin-top:34px;text-shadow:0 2px 8px rgba(0,0,0,.15);}
.home .clockw .hh{font-size:62px;font-weight:300;letter-spacing:2px;}
.home .clockw .dd{font-size:15px;margin-top:2px;}
.apps{margin-top:auto;padding:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 14px;}
.appswipe{width:100%;min-width:0;margin-top:auto;display:flex;flex-shrink:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x pan-y}
.appswipe::-webkit-scrollbar{display:none}
.apppage{width:100%;min-width:100%;flex:0 0 100%;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 14px;padding:22px;scroll-snap-align:start;scroll-snap-stop:always;align-content:start;box-sizing:border-box}
.pgdots{position:relative;z-index:8;flex:none;display:flex;justify-content:center;gap:8px;padding:2px 0 6px;pointer-events:none}
.pgdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.pgdot.on{background:#fff}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.app .ic{width:60px;height:60px;flex:0 0 auto;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 6px 14px rgba(0,0,0,.12);background:#fff;position:relative;}
.app .ic .app-icon-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px}.app .ic .app-icon-fallback[hidden]{display:none}.app .ic .app-icon-fallback svg{width:31px;height:31px}
.app .ic.custom-app-icon{aspect-ratio:1/1;min-width:0;max-width:none;flex:0 0 auto;box-sizing:border-box;overflow:hidden}.app .ic.custom-app-icon>img{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:cover!important;object-position:50% 50%!important;border-radius:inherit;transform:none!important}
.app.app-locked{cursor:not-allowed;opacity:1;}
.app .app-label{display:flex;align-items:center;justify-content:center;gap:3px;width:100%;height:20px;min-height:20px;flex:0 0 20px;line-height:20px;min-width:0;max-width:82px;box-sizing:border-box;overflow:visible;-webkit-text-size-adjust:100%;text-size-adjust:100%}.app .app-label-text{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:20px}.app-lock-name{width:14px;height:14px;display:inline-flex;flex:0 0 14px;align-items:center;justify-content:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.75))}.app-lock-name svg{display:block;width:14px;height:14px;overflow:visible}.app-lock-shackle{fill:none;stroke:#f04455;stroke-width:2.5;stroke-linecap:round;paint-order:stroke;filter:drop-shadow(0 0 1px #ffabb4)}.app-lock-body{fill:#f04455;stroke:#ff9aa5;stroke-width:1}.app-lock-key{fill:#111318;stroke:none}.app-lock-keyline{fill:none;stroke:#111318;stroke-width:1.5;stroke-linecap:round}
.offline-role-entry{width:100%;border:0;margin:0;padding:0 12px;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer}
.appswipe.aedit .app{animation:ajig .34s ease-in-out infinite;touch-action:none;}
.appswipe.aedit .app:hover{animation:none;}
@keyframes ajig{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.appghost .ic{box-shadow:0 12px 24px rgba(0,0,0,.32);}
.appswipe.aedit{touch-action:none;}
.app span{font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25);}
.home .app .ic{filter:brightness(var(--home-app-icon-tone,100%));}
.home .app>span{opacity:var(--home-app-text-opacity,1);}
.dock{position:relative;z-index:8;flex:none;margin:0 16px max(18px,env(safe-area-inset-bottom));background:rgba(255,255,255,.35);border-radius:26px;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;backdrop-filter:blur(8px);}
/* 列表通用 */
.list .row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-bottom:.5px solid #f0f0f0;cursor:pointer;}
.list .row:active{background:#f5f5f5;}
.avatar{width:46px;height:46px;border-radius:9px;flex:0 0 46px;background:linear-gradient(135deg,#9ec5fe,#b8a4e3);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar.sm{width:38px;height:38px;flex-basis:38px;font-size:20px;border-radius:8px;}
.avatar.lg{width:64px;height:64px;flex-basis:64px;font-size:32px;border-radius:13px;}
.pfavwrap{position:relative;display:inline-flex;flex:0 0 auto}
.pfavwrap .pfonline{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:#18d26b;border:2px solid #1c1c1e;box-sizing:border-box}
.wxlight .pfavwrap .pfonline{border-color:#fff}
.meta{flex:1;min-width:0;}
.meta .n{font-size:16px;color:#111;display:flex;align-items:center;gap:6px;}
.meta .s{font-size:13px;color:#999;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.meta .time{font-size:10px;color:#c4c4c8;font-weight:400;opacity:.72;line-height:1.15;}
.meta.time{font-size:10px;color:#c4c4c8;font-weight:400;opacity:.72;line-height:1.15;}
.pfsoft{font-size:11px;color:#8d8d93;background:rgba(160,160,170,.14);border-radius:999px;padding:3px 8px;white-space:nowrap;}
.pfswipe{position:relative;overflow:hidden;background:#fff;border-bottom:.5px solid #f0f0f0;}
.pfswipe .pfmain{position:relative;z-index:1;transition:transform .18s ease;border-bottom:0;}
.pfswipe.open .pfmain{transform:translateX(-76px);}
.pfswipe .pfdel{position:absolute;right:0;top:0;bottom:0;width:76px;border:0;background:#fa5151;color:#fff;font-size:14px;font-weight:600;}
.pin{background:#f7f7f7;}
.tag{font-size:10px;background:#ffe0ea;color:#e0719a;border-radius:4px;padding:1px 5px;}
.badge{background:#fa5151;color:#fff;font-size:11px;border-radius:10px;padding:0 6px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;}
/* 底部tab */
.tabbar{flex:0 0 54px;display:flex;background:#f7f7f7;border-top:.5px solid #ddd;}
.tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#888;cursor:pointer;}
.tabbar .tb.on{color:#ff6fa5;}
.tabbar .tb .i{font-size:21px;}
/* 聊天 */
.chatbg{flex:1;overflow-y:auto;padding:12px 12px 8px;background:#ededed;overflow-anchor:none;}
.tstamp{text-align:center;margin:10px 0;}
.tstamp span{font-size:11px;color:#fff;background:#c5c5c5;padding:2px 7px;border-radius:4px;}
.msg{display:flex;margin:9px 0;align-items:flex-start;gap:8px;}
.msg.msg-enter{animation:msgenter .68s cubic-bezier(.2,.72,.2,1) both;will-change:transform,opacity,filter;}
@keyframes msgenter{from{opacity:0;filter:blur(.7px);transform:translate3d(0,3px,0)}70%{opacity:1;filter:blur(0)}to{opacity:1;filter:blur(0);transform:translate3d(0,0,0)}}
@media (prefers-reduced-motion:reduce){.msg.msg-enter{animation-duration:.01ms}}
.msg .avatar{width:38px;height:38px;flex-basis:38px;font-size:20px;border-radius:7px;}
.col{display:flex;flex-direction:column;gap:4px;max-width:70%;}

.inputbar{flex:0 0 auto;display:flex;align-items:flex-end;gap:7px;padding:7px 9px;background:#f7f7f7;border-top:.5px solid #ddd;}
.inputbar .plus{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#e7e7e9;cursor:pointer;background:linear-gradient(145deg,#45474c,#292b2f);border:1px solid rgba(255,255,255,.12);box-shadow:0 3px 9px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .15s;}
.inputbar .plus:active{transform:scale(.9) rotate(90deg);}
.inputbar textarea{box-sizing:border-box;display:block;flex:1;min-width:0;height:36px;border:none;border-radius:6px;padding:8px 10px;font-size:16px;resize:none;max-height:84px;min-height:36px;line-height:1.25;outline:none;overflow-x:hidden;overflow-y:hidden;vertical-align:top;font-family:inherit;background:#fff;}
.inputbar .send{background:linear-gradient(145deg,#f1f1f2,#bfc1c5);border:1px solid rgba(255,255,255,.3);color:#202124;font-size:14px;font-weight:650;padding:8px 13px;border-radius:7px;cursor:pointer;box-shadow:0 3px 9px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.72);}
.chat-inputbar{position:static;top:auto;gap:2px;padding:7px 2px 13px;}
.chat-inputbar .plus{width:30px;}
.chat-inputbar .send{padding-left:10px;padding-right:10px;}
.chat-inputbar textarea{padding-top:6px;padding-bottom:10px;line-height:20px;}
.manual-reply-row{display:flex;justify-content:flex-end;padding:5px 10px 0;background:#0b0b0c;}
.manual-reply-chip{border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;background:linear-gradient(145deg,#292b30,#191a1e);color:#c9cacf;font-size:12px;font-weight:600;line-height:1;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.05);}
.manual-reply-chip:disabled{opacity:.58;cursor:default;}
.panel{display:none;padding:0;background:#f7f7f7;border-top:.5px solid #eee;}
.panel.show{display:block;}
#panel{order:2;flex:0 0 auto;}
.ptabs{display:flex;gap:16px;padding:8px 16px 0;}
.ptabs span{font-size:13px;color:#888;padding:4px 2px;cursor:pointer;border-bottom:2px solid transparent;}
.ptabs span.on{color:#ddd;border-bottom-color:#ff8fab;}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;}
.ppage{padding:10px 12px;max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.panel .it{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.panel .it .b{width:52px;height:52px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.panel .it span{font-size:11px;color:#666;}

.mcover .coverfull{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.mcover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.2));pointer-events:none;}
.mcover .me{position:absolute;z-index:2;right:14px;bottom:10px;display:flex;align-items:flex-end;gap:10px;}

.wxlogin-line-lock:before,.wxlogin-line-lock:after{content:"";position:absolute;border-radius:34px;border:1px solid rgba(255,50,72,.25);animation:wxloginPulse 2.4s ease-out infinite;}
.wxlogin-line-lock:before{inset:-9px}.wxlogin-line-lock:after{inset:-18px;animation-delay:1.2s}
.wxlogin-line-lock svg{filter:drop-shadow(0 4px 14px rgba(255,255,255,.15));}
.wxlogin-title{font-size:19px;font-weight:650;margin-bottom:7px;letter-spacing:.3px;color:#f2f2f4;}
.wxlogin-actor{font-size:15px;color:#ff4b60;margin-bottom:21px;text-shadow:0 0 13px rgba(255,48,72,.3);}
.wxlogin-note{font-size:13px;color:#93949a;line-height:1.95;max-width:270px;}
.wxlogin-countdown{display:inline-block;min-width:30px;color:#ff334b;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,40,65,.62);animation:wxloginCount 1s ease-in-out infinite;}
@keyframes wxloginGrid{from{background-position:0 0,0 0}to{background-position:0 38px,38px 0}}
@keyframes wxloginFloatA{from{transform:translate3d(0,-18px,0) scale(.9)}to{transform:translate3d(78px,45px,0) scale(1.16)}}
@keyframes wxloginFloatB{from{transform:translate3d(0,22px,0) scale(1.08)}to{transform:translate3d(-75px,-35px,0) scale(.88)}}
@keyframes wxloginLockFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes wxloginPulse{0%{opacity:.55;transform:scale(.84)}100%{opacity:0;transform:scale(1.2)}}
@keyframes wxloginCount{0%,100%{opacity:1}50%{opacity:.58}}
.remote-consent{position:relative;overflow:hidden;margin:-18px -16px;padding:24px 20px 20px;border-radius:18px;background:radial-gradient(circle at 50% -20%,rgba(211,31,62,.34),transparent 55%),linear-gradient(160deg,#151116,#08090c 58%,#040506);color:#e9e9ec;text-align:center;border:1px solid rgba(255,70,91,.22);}
.remote-consent:before{content:"";position:absolute;inset:0;opacity:.16;background-image:linear-gradient(rgba(255,67,88,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,67,88,.12) 1px,transparent 1px);background-size:31px 31px;pointer-events:none;}
.remote-consent-scan{position:absolute;left:-20%;right:-20%;height:70px;top:-80px;background:linear-gradient(180deg,transparent,rgba(255,44,69,.11),transparent);animation:remoteConsentScan 3.2s linear infinite;pointer-events:none;}
.remote-consent-head{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;color:#ff5366;font-size:9px;letter-spacing:1.7px;margin-bottom:20px;}
.remote-consent-dot{width:7px;height:7px;border-radius:50%;background:#ff2d46;box-shadow:0 0 10px #ff2d46;animation:spyRecordBlink .92s ease-in-out infinite;}
.remote-consent-avatar{position:relative;width:70px;height:70px;margin:0 auto 15px;border-radius:23px;padding:3px;background:linear-gradient(145deg,rgba(255,82,103,.68),rgba(255,255,255,.1));box-shadow:0 14px 34px rgba(0,0,0,.48),0 0 30px rgba(255,41,67,.12);}
.remote-consent-avatar .avatar{width:64px!important;height:64px!important;border-radius:20px!important;}
.remote-consent h3{position:relative;color:#f4f4f6!important;font-size:19px!important;margin-bottom:10px!important;}
.remote-consent-copy{position:relative;color:#aaa9b0;font-size:13px;line-height:1.75;max-width:300px;margin:0 auto;}
.remote-consent-warning{position:relative;color:#e35e6c;font-size:10px;margin:15px 0 18px;letter-spacing:.2px;}
.remote-consent-actions{position:relative;display:flex;gap:10px;}
.remote-consent-actions button{height:44px;flex:1;border-radius:12px;font-size:14px;font-weight:650;cursor:pointer;}
.remote-deny{border:1px solid #39383e;background:#17171b;color:#aaaab0;}
.remote-allow{border:1px solid rgba(255,74,94,.5);background:linear-gradient(135deg,#ca203b,#ff4058);color:#fff;box-shadow:0 8px 22px rgba(233,34,65,.24);}
@keyframes remoteConsentScan{from{top:-80px}to{top:110%}}
.remote-control-layer{position:absolute;inset:0;z-index:550;display:none;overflow:hidden;color:#f4f4f6;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;pointer-events:auto;}
.remote-control-layer.show{display:flex;flex-direction:column;animation:remoteLayerIn .34s ease-out;}
.remote-control-layer:before{content:"";position:absolute;inset:56px 0 0;z-index:1;border:1px solid rgba(255,42,66,.12);background:linear-gradient(180deg,rgba(255,28,56,.035),transparent 18%,transparent 76%,rgba(0,0,0,.2));box-shadow:inset 0 0 36px rgba(255,30,54,.035);pointer-events:none;}
.remote-control-top{position:relative;z-index:4;flex:0 0 56px;display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid rgba(255,61,82,.16);background:rgba(8,8,11,.72);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);}
.remote-control-top .avatar{width:32px!important;height:32px!important;flex-basis:32px!important;border-radius:10px!important;}
.remote-live-dot{position:relative;width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#ff2942;box-shadow:0 0 8px #ff2942,0 0 16px rgba(255,41,66,.5);animation:spyRecordBlink .9s ease-in-out infinite;}
.remote-live-dot:after{content:"";position:absolute;inset:-4px;border:1px solid rgba(255,45,67,.5);border-radius:50%;animation:spyRecordRing 1.3s ease-out infinite;}
.remote-control-who{flex:1;min-width:0;}
.remote-control-who b{display:block;color:#ff5265;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.remote-control-who small{display:block;color:#74747b;font-size:9px;letter-spacing:.8px;margin-top:2px;}
.remote-elapsed{color:#ff4056;font-size:11px;font-variant-numeric:tabular-nums;}
.remote-stop{border:1px solid #35343a;border-radius:8px;background:rgba(22,22,26,.9);color:#8e8e95;font-size:10px;padding:6px 8px;cursor:pointer;}
.remote-pointer{position:absolute;z-index:5;width:19px;height:25px;left:var(--tap-x,65%);top:var(--tap-y,48%);opacity:0;filter:drop-shadow(0 4px 7px rgba(0,0,0,.7));transition:left .45s ease,top .45s ease;}
.remote-pointer:before{content:"";display:block;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:20px solid #f5f5f6;transform:rotate(-32deg);transform-origin:center;}
.remote-pointer.tap{animation:remoteTap 1.15s cubic-bezier(.2,.75,.25,1);}
.remote-caption-wrap{position:absolute;z-index:20;left:14px;right:14px;bottom:max(20px,env(safe-area-inset-bottom));pointer-events:none;}
.remote-caption{min-height:42px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:7px;}
.remote-caption-bubble{max-width:90%;align-self:flex-start;padding:11px 14px;border:1px solid rgba(255,255,255,.16);border-radius:15px;background:rgba(13,10,13,.94);color:#fff;font-size:14px;line-height:1.62;box-shadow:0 9px 26px rgba(0,0,0,.46);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;animation:remoteCaptionUp .38s cubic-bezier(.2,.72,.25,1);}
.remote-exit-notice{position:absolute;left:50%;top:72px;z-index:545;display:none;align-items:center;gap:8px;transform:translateX(-50%);max-width:86%;padding:9px 13px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(16,16,20,.92);color:#e8e8ee;font-size:12px;letter-spacing:.2px;box-shadow:0 10px 26px rgba(0,0,0,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.remote-exit-notice.show{display:flex;animation:remoteExitIn .28s ease-out;}
.remote-exit-dot{width:7px;height:7px;border-radius:50%;background:#8f929b;box-shadow:0 0 8px rgba(180,184,196,.45);}
@keyframes remoteLayerIn{from{opacity:0}to{opacity:1}}
@keyframes remoteCaptionUp{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes remoteExitIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes remoteTap{0%{opacity:0;transform:translate(28px,24px) scale(.9)}35%{opacity:1;transform:translate(0,0) scale(1)}58%{opacity:1;transform:translate(0,4px) scale(.83)}75%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(-5px,-4px)}}
.msgbanner{position:absolute;top:8px;left:10px;right:10px;z-index:440;background:rgba(40,40,46,.97);border:1px solid #3a3a40;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer;}
.msgbanner.show{display:flex;animation:slided .25s ease;}
@keyframes slided{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.msgbanner .bn{font-size:14px;color:#fff;font-weight:600;}
.msgbanner .bm{font-size:13px;color:#bbb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 锁屏：独立覆盖层，不打断原本路由 */
.lockscreen{position:absolute;inset:0;z-index:435;display:flex;flex-direction:column;color:#fff;overflow:hidden;background:#08090d;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-100%);transition:opacity .46s ease,transform .62s cubic-bezier(.18,.88,.22,1),visibility .46s;}
.lockscreen.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0);}
.lockbg{position:absolute;inset:0;background:linear-gradient(155deg,#748398 0%,#465568 48%,#1c2734 100%);background-position:center;background-size:cover;transform:scale(1.02);}
.lockshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.025) 34%,rgba(0,0,0,.12) 58%,rgba(0,0,0,.48));}
.locktop{position:relative;z-index:2;padding:51px 16px 0;text-align:center;isolation:isolate;}
.lockdate{margin:0 0 6px;font-size:15px;font-weight:520;letter-spacing:.025em;color:rgba(255,255,255,.94);text-shadow:0 1px 2px rgba(0,0,0,.46),0 4px 18px rgba(0,0,0,.36);}
/* 时间没有卡片：只有数字本体呈透明立体玻璃。 */
.locktime{position:relative;display:inline-block;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;font-size:100px;font-weight:520;font-synthesis:none;line-height:.9;letter-spacing:-.015em;font-variant-numeric:tabular-nums;color:rgba(var(--lock-time-rgb,255,255,255),.009);-webkit-text-stroke:.68px rgba(var(--lock-time-rgb,255,255,255),.3);background:none;isolation:isolate;text-shadow:-1px -1px .8px rgba(var(--lock-time-rgb,255,255,255),.28),1px 2px 1px rgba(0,0,0,.2);filter:drop-shadow(0 -1px 1px rgba(var(--lock-time-rgb,255,255,255),.34)) drop-shadow(0 5px 7px rgba(0,0,0,.18));}
.locktime::before,.locktime::after{position:absolute;inset:0;pointer-events:none;font:inherit;letter-spacing:inherit;}
.locktime::before{content:"";z-index:-1;inset:0;background:linear-gradient(180deg,rgba(var(--lock-time-rgb,255,255,255),.1) 0%,rgba(var(--lock-time-rgb,255,255,255),.026) 34%,rgba(7,17,30,.022) 58%,rgba(var(--lock-time-rgb,255,255,255),.055) 80%,rgba(var(--lock-time-rgb,255,255,255),.012) 100%);-webkit-backdrop-filter:blur(1.25px) saturate(152%) contrast(116%) brightness(107%);backdrop-filter:blur(1.25px) saturate(152%) contrast(116%) brightness(107%);-webkit-mask-image:var(--lock-time-mask);mask-image:var(--lock-time-mask);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
.locktime::after{content:attr(data-time);z-index:1;color:transparent;-webkit-text-stroke:1.08px rgba(var(--lock-time-rgb,255,255,255),.82);mix-blend-mode:screen;text-shadow:-1px -1px 0 rgba(var(--lock-time-rgb,255,255,255),.58),1px 1px .6px rgba(var(--lock-time-rgb,255,255,255),.16),1px 2px 1px rgba(0,0,0,.26),0 0 3px rgba(var(--lock-time-rgb,255,255,255),.12);-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.96) 24%,rgba(0,0,0,.42) 46%,rgba(0,0,0,.09) 65%,rgba(0,0,0,.24) 82%,rgba(0,0,0,.58) 100%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.96) 24%,rgba(0,0,0,.42) 46%,rgba(0,0,0,.09) 65%,rgba(0,0,0,.24) 82%,rgba(0,0,0,.58) 100%);}
.locknotes{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px;margin:24px 14px 0;max-height:47%;overflow:hidden;pointer-events:auto;}
.locknote{position:relative;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:21px;background:linear-gradient(135deg,var(--lock-glass-shine,rgba(255,255,255,.17)),var(--lock-glass-soft,rgba(255,255,255,.045)) 45%,var(--lock-glass-main,rgba(10,12,18,.12)));border:1px solid var(--lock-glass-line,rgba(255,255,255,.3));box-shadow:0 5px 12px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.08);backdrop-filter:blur(24px) saturate(135%);-webkit-backdrop-filter:blur(24px) saturate(135%);cursor:pointer;overflow:hidden;isolation:isolate;}
.locknote::after{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);opacity:.7;pointer-events:none;}
.locknote.fresh{animation:locknotein .48s cubic-bezier(.2,.8,.2,1) both;}
.locknote .avatar{width:34px;height:34px;flex-basis:34px;border-radius:11px;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.25);}
.locknote .ltxt{flex:1;min-width:0}.locknote .lt{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 5px rgba(0,0,0,.48)}.locknote .lb{font-size:12px;color:rgba(255,255,255,.84);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 5px rgba(0,0,0,.46)}.locknote .lk{font-size:11px;color:rgba(255,255,255,.68);margin-left:6px;white-space:nowrap;text-shadow:0 1px 5px rgba(0,0,0,.45);}
@keyframes locknotein{from{opacity:0;transform:translateY(-10px) scale(.98);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
.lockempty{padding:13px 15px;border-radius:21px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.055));border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);color:rgba(255,255,255,.78);font-size:12px;text-align:center;backdrop-filter:blur(22px) saturate(130%);-webkit-backdrop-filter:blur(22px) saturate(130%);}
.locknotes{margin-top:auto;margin-bottom:8px;}
.lockbottom{position:relative;z-index:2;margin-top:0;padding:0 24px 17px;display:grid;grid-template-columns:60px minmax(0,1fr) 60px;align-items:end;gap:14px;}
.lockquick{position:relative;width:58px;height:58px;border-radius:50%;border:1px solid var(--lock-glass-line,rgba(255,255,255,.38));background:radial-gradient(circle at 34% 25%,var(--lock-glass-shine,rgba(255,255,255,.23)),var(--lock-glass-soft,rgba(255,255,255,.055)) 34%,var(--lock-glass-main,rgba(7,9,14,.2)) 72%);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(22px) saturate(135%);-webkit-backdrop-filter:blur(22px) saturate(135%);box-shadow:0 10px 24px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.58),inset 0 -1px 1px rgba(255,255,255,.12);cursor:pointer;overflow:hidden;}
.lockquick::after{content:"";position:absolute;left:19%;right:19%;top:8%;height:24%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent);filter:blur(1px);pointer-events:none;}
.lockhint{padding:4px 8px 2px;border:0;background:transparent;box-shadow:none;text-align:center;align-self:center;font-size:12px;color:rgba(255,255,255,.82);text-shadow:0 2px 8px rgba(0,0,0,.55);}
.lockup{width:12px;height:12px;border-left:2px solid rgba(255,255,255,.88);border-top:2px solid rgba(255,255,255,.88);transform:rotate(45deg);margin:0 auto 8px;animation:lockuparrow 1.55s ease-in-out infinite;}
@keyframes lockuparrow{0%,100%{opacity:.46;transform:translateY(3px) rotate(45deg)}50%{opacity:.95;transform:translateY(-2px) rotate(45deg)}}
.lockhandle{width:min(118px,88%);height:4px;border-radius:999px;background:rgba(255,255,255,.88);margin:7px auto 0;box-shadow:0 2px 8px rgba(0,0,0,.32),inset 0 1px 0 #fff;}
.lockpull{position:absolute;top:7px;left:50%;z-index:434;width:42px;height:24px;transform:translateX(-50%);border:0;border-radius:999px;background:rgba(28,29,34,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 7px 20px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12);display:none;align-items:center;justify-content:center;cursor:pointer;}
.lockpull.show{display:flex;animation:lockpullin .28s ease both;}
.lockpull:before{content:"";width:10px;height:10px;border-right:2px solid rgba(255,255,255,.86);border-bottom:2px solid rgba(255,255,255,.86);transform:rotate(45deg) translateY(-2px);}
@keyframes lockpullin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (max-height:690px){.locktop{padding-top:40px}.locktime{font-size:80px}.locknotes{max-height:42%;margin-bottom:8px}.lockbottom{padding-bottom:14px}.lockquick{width:54px;height:54px}}
.phoneui{background:#000;color:#f5f5f7;height:100%;display:flex;flex-direction:column;overflow:hidden;}
.phtop{flex:0 0 auto;padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;}

<script>
/* 安卓启动保护：资源或旧缓存出错时显示自救页，不让用户只看到黑屏。 */
(function(){
  window.__northBootReady=false;
  function safeText(v){return String(v||'').replace(/[<>]/g,'').slice(0,180);}
  function reasonText(raw){var s=String(raw||'');if(/quota|storage|memory|out of memory/i.test(s))return '本机网页存储或内存不足。先修复缓存；能进入后请尽快导出备份并清理旧图片。';if(/syntax|unexpected token|not defined|not a function/i.test(s))return '浏览器内核过旧或脚本没有完整加载。请更新 Chrome / 系统 WebView，再修复缓存。';if(/404|failed to load|loading chunk|network|fetch/i.test(s))return '页面文件没有完整加载，通常是网络抖动或旧缓存造成的。';return '启动时遇到异常，聊天和角色数据仍保存在本机，没有被清除。';}
  function retryUrl(){return location.pathname+'?reload='+Date.now()+(location.hash||'');}
  function repairUrl(){return location.pathname.replace(/[^/]*$/,'repair.html')+'?from=boot&v='+(window.__NORTH_SHELL_BUILD__||'')+'&t='+Date.now();}
  function ownBootError(e){var target=e&&(e.target||e.srcElement),tag=String(target&&target.tagName||'').toUpperCase();if(target&&target!==window&&target!==document)return tag==='SCRIPT'&&/\b(?:app|license-gate)\.js(?:\?|$)/i.test(String(target.src||''));var file=String(e&&e.filename||'');var msg=String(e&&e.message||'');if(/^script error\.?$/i.test(msg)&&!file)return false;if(file&&!/(?:小手机\.html|\/app\.js|\/license-gate\.js)(?:\?|$)/i.test(file))return false;return true;}
  window.__northRetry=function(){location.replace(retryUrl());};
  window.__northRepair=function(){location.replace(repairUrl());};
  window.__northBootFail=function(raw){if(window.__northBootReady)return;var app=document.getElementById('app');if(!app)return;var detail=safeText(raw);app.innerHTML='<div class="bootbox"><div class="bootcard"><div class="bootlogo">🛠️</div><div class="boottitle">小手机没有正常启动</div><div class="bootmsg">'+reasonText(raw)+(detail?'<br><small style="color:#777">诊断：'+detail+'</small>':'')+'<br><b style="color:#8fd6a7">下面操作不会删除聊天、角色或密钥。</b></div><a class="bootbtn" href="'+retryUrl()+'">重新加载</a><a class="bootbtn secondary" href="'+repairUrl()+'">修复页面缓存后重开</a></div></div>';};
  window.addEventListener('error',function(e){if(!window.__northBootReady&&ownBootError(e))window.__northBootFail((e&&e.message)||'关键页面文件加载失败');},true);
  window.addEventListener('unhandledrejection',function(e){if(!window.__northBootReady)window.__northBootFail((e&&e.reason&&e.reason.message)||'启动任务失败');});
  setTimeout(function(){if(!window.__northBootReady)window.__northBootFail('启动超过 12 秒，可能是网络或缓存异常');},12000);
})();
</script>
