<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee3d5">
  <link rel="icon" href="data:,">
  <title>像素少女小屋 · v1205</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="immersive.css?v=1205">
</head>
<body>
<div id="immersive-backdrop" aria-hidden="true"></div>
<aside class="intro">
  <div class="eyebrow">A LITTLE LIFE, WITH YOU</div>
  <h1>像素少女<span>被认真照顾的<br>每一天。</span></h1>
  <p>一间暖暖的小屋，一柜子喜欢的裙子，<br>还有一些，只属于你的可爱小事。</p>
  <div class="intro-guide"><b>把食物递到她嘴边</b><span>摸摸头，戳戳脸，陪她玩一会儿。</span></div>
  <div class="preview-note">P76 · 本地核心试玩<br>让他照顾不调用模型，不连接正式存档。</div>
</aside>
<section id="wardrobe-overlay" hidden><iframe id="wardrobe-frame" title="我的衣柜"></iframe></section><main class="phone" id="game" aria-label="像素少女游戏"><button class="exit-home" id="exit-home" type="button" aria-label="返回游戏大厅">返回</button>
  <section class="world" id="world" aria-label="少女的房间">
    <canvas id="scene" aria-label="可互动少女：轻戳脸颊、长按摸头，拖食物到嘴边"></canvas>
    <div class="loading" id="loading">正在打开小屋<span>把阳光和裙摆准备好…</span></div>
    <div class="topbar"><button id="body-toggle" aria-label="调整人物比例">比例</button><button class="coin" id="shop-short" aria-label="打开小铺"><span>✧</span> <b id="coins">120</b></button></div>
    <div class="welcome"><span class="date" id="today"></span><div>今天，也要被好好照顾<span>♡</span></div></div>
    <div class="side-tools"><button id="photo" aria-label="拍下当前穿搭" title="拍下当前穿搭">相机</button><button id="sound" aria-label="选择音乐歌单" title="音乐歌单">音乐</button><button data-panel="album" aria-label="今天的收藏" title="今天的收藏">收藏</button><button id="help" aria-label="玩法" title="玩法">玩法</button></div>
    <div class="speech" id="speech" role="status" aria-live="polite">轻轻戳一下我的脸颊吧 ♡</div>
    <div id="feedback" class="feedback" hidden></div>
    <button id="save-warning" class="save-warning" hidden>进度未保存 · 腾出浏览器空间后点此重试</button>
    <div class="care-progress" id="care-progress" hidden><span id="care-text"></span><button id="cancel-care">停止</button></div>
    <div class="wash-progress" id="wash-progress" hidden>泡泡清洁 <progress id="wash-meter" max="100" value="0"></progress></div>
    <button id="mirror-hotspot" class="mirror-hotspot" aria-label="照镜子 放大小脸" hidden>照镜子</button>
    <button id="mirror-back" class="mirror-back" hidden>返回浴室</button>
    <div id="groom-progress" class="groom-progress" hidden><span id="groom-label"></span><progress id="groom-meter" max="100" value="0"></progress></div>
    <div class="scene-caption"><span id="room-name">01 / 暖暖卧室</span><span id="room-hint">左右滑动，去另一个房间</span></div>
  </section>
  <section class="tray" id="tray" aria-label="互动道具"></section>
  <div class="rooms" aria-label="切换房间"><button data-room="0" class="selected">☾ 卧室</button><button data-room="1">♧ 餐桌</button><button data-room="2">♨ 浴室</button></div>
  <button class="scene-arrow previous" id="previous-room" aria-label="上一个房间">‹</button><button class="scene-arrow next" id="next-room" aria-label="下一个房间">›</button>
  <nav class="dock" aria-label="游戏功能"><button data-panel="wardrobe"><span>♧</span>衣柜</button><button data-panel="vanity"><span>♢</span>梳妆台</button><button id="care"><span>♡</span>让他照顾</button><button data-panel="shop"><span>⌂</span>小铺</button></nav>
  <div class="vitals" id="vitals" aria-label="少女状态"></div>
  <section class="drawer" id="drawer" hidden aria-label="游戏面板"><div class="drawer-head"><div><small id="drawer-kicker"></small><h2 id="drawer-title"></h2></div><button id="close-drawer" aria-label="关闭面板">×</button></div><p id="panel-feedback"></p><div id="drawer-content"></div></section>
  <div class="flash" id="flash"></div>
  <div class="night-vignette" id="night"></div>
  <span class="build">v1205 · 本地试玩</span>
</main>
<aside class="journal"><div class="eyebrow">LITTLE MOMENTS</div><h2>今天的小确幸</h2><p>衣服会留下回忆，<br>照顾也会。</p><ol id="diary"></ol><div class="journal-bottom">轻戳 · 抚摸 · 拖拽 · 换装<br><span>用鼠标或手指，都可以陪她玩。</span></div></aside>
<div id="care-cursor" hidden aria-hidden="true"><div id="care-held"></div><svg width="32" height="40" viewBox="0 0 32 40"><path d="M3 2 L3 31 L11 24 L18 38 L24 35 L17 22 L29 22 Z" fill="#fff9ef" stroke="#b57587" stroke-width="2"/></svg></div>
<section id="body-panel" hidden aria-label="人物比例"><button id="body-close" aria-label="关闭比例调整">×</button><div class="body-controls"><label>人物大小<input id="room-size" type="range" min="60" max="150" step="1" value="100"><output id="room-size-value">100%</output></label><label>腿部长度<input id="room-legs" type="range" min="55" max="110" step="1" value="85"><output id="room-legs-value">85%</output></label><label>腿部宽度<input id="room-legWidth" type="range" min="60" max="140" step="1" value="100"><output id="room-legWidth-value">100%</output></label></div><button id="body-save">保存参数</button></section><script src="bridge.js?v=1205"></script><script src="assets.js?v=1205"></script><script src="wardrobe/data.js?v=1205"></script><script src="sound.js"></script>
<script src="music.js"></script>
<script src="core.js"></script>
<script src="care-policy.js"></script>
<script src="game.js?v=1205"></script>
</body>
</html>
