<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小手机智能家电助手</title><link rel="stylesheet" href="style.css"></head><body><main><header><span>小手机</span><h1>智能家电助手</h1><p>电脑常开 · 局域网真实回读 · 无需额外中枢</p></header><section id="setup" class="card"><h2>连接这一台电脑</h2><ol><li>在网页版小手机打开“服务 → 智能家电”</li><li>点“连接 Windows 电脑”取得十位数字</li><li>把数字填在下面</li></ol><input id="pairCode" inputmode="numeric" maxlength="11" placeholder="例如 12345 67890"><button id="pair">一键连接</button></section><section id="linked" class="card hidden"><div class="status"><i id="dot"></i><div><h2 id="title">正在检查</h2><p id="detail"></p></div></div><button id="test">读取并验证现在的灯</button><button id="open" class="secondary">打开网页版小手机</button><p class="notice">程序只允许控制已发现的 MSL430 开关、亮度、颜色和色温。每次命令后都会重新读取；电脑或灯离线时网页会如实失败。</p><button id="forget" class="danger">清除本机绑定</button></section><div id="message"></div><footer>不保存 Wi-Fi 密码、HomeKit 配对码或二维码；电脑开机后自动运行。</footer></main><script src="renderer.js"></script></body></html>
