<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3e9df"><title>我的衣柜 · v1213</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:,"></head><body>
<header><a href="../" class="home" aria-label="返回小屋">⌂</a><div><h1>我的衣柜</h1><span id="counts"></span></div><div class="save-buttons"><button id="save-custom">存为套装</button><button id="save">保存搭配</button></div></header>
<main><section class="mirror"><div id="stage"><canvas id="scene" aria-label="穿搭预览"></canvas><div id="loading">正在打开衣柜…</div></div><div class="viewbar"><button id="smaller" aria-label="缩小预览">−</button><label class="preview-scale"><input id="preview-scale" type="range" aria-label="人物预览大小" min="85" max="200" value="130" step="5"><output id="preview-value">130%</output></label><button id="bigger" aria-label="放大预览">＋</button><button id="view">放大细节</button><select id="frame-preview" aria-label="表情预览"><option value="auto">自动眨眼</option><option value="open">保持睁眼</option><option value="half">保持半闭眼</option><option value="closed">保持闭眼</option></select><button id="motion" aria-pressed="true">动态</button><button id="photo">拍照</button></div></section>
<section class="wardrobe"><nav id="tabs" aria-label="衣柜分类"></nav><div id="rack" aria-label="服饰选择"></div><details id="adjust"><summary>调整参数</summary><div class="body-controls"><label>人物大小<input id="body-size" type="range" min="60" max="150" step="1" value="100"><output id="body-size-value">100%</output></label><label>腿部长度<input id="body-legs" type="range" min="55" max="110" step="1" value="85"><output id="body-legs-value">85%</output></label><label>腿部宽度<input id="body-legWidth" type="range" min="60" max="140" step="1" value="100"><output id="body-legWidth-value">100%</output></label></div><div class="edit-head"><select id="target" aria-label="调整对象"></select><select id="part" aria-label="调整部位"></select></div><div id="sliders"></div><div class="edit-actions"><button id="undo">撤销</button><button id="reset">恢复默认</button><button id="save-params">保存参数</button><button id="export">导出配置</button><label class="import">导入配置<input type="file" id="import" accept="application/json,.json"></label></div></details></section></main><dialog id="set-dialog"><form id="set-form"><h2 id="set-dialog-title">保存自定义套装</h2><p id="set-message"></p><label id="set-name-row">套装名称<input id="set-name" aria-label="套装名称" maxlength="30" autocomplete="off" required placeholder="例如：周末小白裙"></label><div class="dialog-actions"><button id="set-cancel" type="button">取消</button><button id="set-confirm" type="submit">保存套装</button></div></form></dialog><output id="notice" role="status" aria-live="polite"></output><script src="../assets.js?v=1213"></script><script src="app.js?v=1213"></script></body></html>
