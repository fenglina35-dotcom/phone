<body>
<header class="bar"><h1>高级玻璃主题 · 真实小手机预览</h1><div class="sub">这里直接载入正式小手机页面；示例数据只存在于预览，不会覆盖你的真实存档。</div><nav class="tabs" id="tabs"></nav></header>

const tabs=document.querySelector('#tabs'),frame=document.querySelector('#phone'),device=document.querySelector('#device'),title=document.querySelector('#title'),desc=document.querySelector('#desc'),open=document.querySelector('#open');
function show(i){const [mode,name,text]=views[i],url='小手机.html?northPreview='+encodeURIComponent(mode)+'&previewBuild=20260814f';frame.src=url;title.textContent=name;desc.textContent=text;open.href=url;device.classList.toggle('tablet',mode.includes('tablet'));[...tabs.children].forEach((b,n)=>b.classList.toggle('on',n===i));history.replaceState(null,'','#'+mode)}
async function clearStalePreviewShell(){
  try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(reg=>reg.unregister()));}}catch(_){}
  try{if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(key=>key.startsWith('north-shell-')).map(key=>caches.delete(key)));}}catch(_){}

<script>
if(new URLSearchParams(location.search).get('motion')==='wechat'){
(()=>{
const fields=[
['sendDelay','发送后等待',0,1200,10,0,'ms'],['bubbleDuration','气泡出现时长',0,1600,10,420,'ms'],['bubbleY','气泡上移距离',0,60,1,12,'px'],['bubbleScale','气泡初始比例',70,100,1,97,'%'],['bubbleOpacity','气泡初始透明度',0,100,1,0,'%'],
['avatarDelay','头像出现延迟',0,2000,10,80,'ms'],['avatarDuration','头像渐显时长',0,1600,10,520,'ms'],['avatarY','头像上移距离',0,40,1,6,'px'],['avatarScale','头像初始比例',70,100,1,94,'%'],
['scrollDelay','画面上推延迟',0,1000,10,0,'ms'],['scrollDuration','画面上推时长',0,2000,10,580,'ms'],['scrollPower','上推减速强度',1,5,.1,3,''],['bottomGap','消息底部留白',0,80,1,18,'px'],
['readDelay','每条消息已读等待',0,5000,50,2000,'ms'],['readDuration','已读字幕渐显时长',0,2000,10,700,'ms'],['readY','已读字幕上移距离',0,24,1,4,'px'],['readSpacing','已读两字出现间隔',0,600,10,90,'ms'],
['timeDelay','时间出现延迟',0,3000,10,220,'ms'],['timeDuration','时间渐显时长',0,2000,10,600,'ms'],['timeY','时间上移距离',0,30,1,5,'px'],['replyDelay','演示对方回复间隔',300,5000,50,2200,'ms'],['rowGap','消息之间的间距',4,30,1,12,'px']
];
const key='north-wechat-motion-lab-v1',defaults=Object.fromEntries(fields.map(f=>[f[0],f[5]]));let cfg={...defaults},generation=0,readTimers=[],scrollFrame=0;
function clean(v){if(!v||typeof v!=='object'||Array.isArray(v))throw Error('请输入参数 JSON 对象');const out={};fields.forEach(f=>{const n=v[f[0]];out[f[0]]=typeof n==='number'&&Number.isFinite(n)?Math.min(f[3],Math.max(f[2],n)):f[5];});out.theme=v.theme==='light'?'light':'dark';out.easing=['ease-out','ease-in-out','linear'].includes(v.easing)?v.easing:'ease-out';out.enabled=v.enabled!==false;return out;}
try{const saved=localStorage.getItem(key);cfg=clean(saved?JSON.parse(saved):{});}catch(_){cfg=clean({});}
document.title='微信 · 动画参数调试';
document.body.innerHTML=`<header class="bar"><h1>微信 · 动画参数调试</h1><div class="sub">先调整手感，再应用到正式页面。这里是隔离演示，不发送真实消息；未读不显示文字。</div></header><main class="motion-layout"><section class="motion-preview"><div class="motion-phone" id="motionPhone"><div class="motion-status">9:41 <span>●●● ▰</span></div><div class="motion-nav">‹ <b>林间</b> ···</div><div class="motion-chat" id="motionChat" tabindex="0" aria-label="聊天动画预览"></div><div class="motion-composer"><span>◉</span><input id="motionInput" aria-label="演示消息" value="今天想慢一点，和你聊聊天。"><button id="motionSend">发送</button></div></div><div class="motion-actions"><button id="motionReplay">重播完整过程</button><button id="motionRead">模拟实际已读</button><button id="motionReply">模拟收到消息</button></div><p id="motionState" role="status">未读：不显示任何状态文字</p><p class="sub">“模拟实际已读”只改变本页演示状态。向上查看历史时，收到消息不会强制拉回底部。</p></section><aside class="motion-controls"><div class="motion-toolbar"><button id="motionSave">保存参数</button><button id="motionReset">恢复默认</button><button id="motionExport">导出参数</button><button id="motionImport">导入参数</button></div><div class="motion-selects"><label>外观 <select id="motionTheme"><option value="dark">黑色微信</option><option value="light">白色微信</option></select></label><label>入场曲线 <select id="motionEasing"><option value="ease-out">柔和减速</option><option value="ease-in-out">先慢后快再慢</option><option value="linear">匀速</option></select></label><label><input type="checkbox" id="motionEnabled"> 启用动画</label></div><div id="motionFields"></div><details><summary>参数 JSON（可复制、粘贴）</summary><textarea id="motionJSON" aria-label="参数 JSON" rows="10"></textarea></details></aside></main>`;
const style=document.createElement('style');style.textContent=`.motion-layout{display:grid;grid-template-columns:390px minmax(300px,650px);gap:36px;max-width:1120px;margin:auto;padding:24px}.motion-preview{position:sticky;top:110px;align-self:start}.motion-phone{height:650px;display:flex;flex-direction:column;border:1px solid #363638;border-radius:28px;overflow:hidden;background:#111;color:#ededed}.motion-status{padding:12px 24px 8px;font-size:13px}.motion-status span{float:right}.motion-nav{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #292929;font-size:24px}.motion-nav b{font-size:17px}.motion-chat{flex:1;min-height:0;overflow:auto;padding:14px 14px 18px;overflow-anchor:none;scroll-behavior:auto}.motion-row{display:flex;gap:9px;margin:12px 0;align-items:flex-start}.motion-row.mine{flex-direction:row-reverse}.motion-avatar{height:40px;width:40px;flex:0 0 40px;border-radius:7px;background:#758b78;display:grid;place-items:center;color:white;font-size:19px}.motion-row.mine .motion-avatar{background:#747c98}.motion-column{max-width:74%;position:relative}.motion-bubble{padding:10px 12px;background:#292929;border-radius:5px;white-space:pre-wrap;overflow-wrap:anywhere;color:#eee;line-height:1.5}.mine .motion-bubble{background:#95ec69;color:#111}.motion-read{position:absolute;right:calc(100% + 6px);bottom:1px;white-space:nowrap;font-size:11px;color:#94949b}.motion-read span{display:inline-block}.motion-row:not(.mine) .motion-read{right:auto;left:calc(100% + 6px)}.motion-time{font-size:11px;color:#8d8d96;text-align:center;margin:18px 0}.motion-composer{display:flex;gap:8px;align-items:center;padding:12px;background:#1d1d1d;border-top:1px solid #292929}.motion-composer input{min-width:0;flex:1;background:#2b2b2b;border:0;color:inherit;border-radius:5px;padding:9px}.motion-composer button{background:#07c160;color:white;border:0;border-radius:5px;padding:9px 12px}.motion-actions,.motion-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.motion-actions button,.motion-toolbar button{cursor:pointer;background:#242428;color:#eee;border:1px solid #444;border-radius:8px;padding:9px 12px}.motion-selects{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}.motion-selects select{background:#222;color:#eee;border:1px solid #555;padding:5px}.motion-field{display:grid;grid-template-columns:1fr 78px 28px;gap:6px;margin:0 0 15px;padding-bottom:12px;border-bottom:1px solid #27272b}.motion-field label{grid-column:1;font-size:13px}.motion-field input[type=range]{grid-column:1;width:100%;accent-color:#64c887;grid-row:2}.motion-field input[type=number]{grid-column:2;grid-row:2;width:78px;background:#202024;color:#eee;border:1px solid #45454b;border-radius:5px;padding:5px}.motion-field small{grid-column:3;grid-row:2;align-self:center;color:#999}#motionFields{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}#motionJSON{width:100%;margin-top:10px;background:#18181b;color:#ddd;border:1px solid #555;padding:10px}.motion-phone.light{background:#ededed;color:#111}.light .motion-nav{border-color:#ddd}.light .motion-bubble{background:#fff;color:#111}.light .mine .motion-bubble{background:#95ec69}.light .motion-composer{background:#f6f6f6;border-color:#ddd}.light .motion-composer input{background:#fff}.light .motion-status{color:#111}@media(max-width:850px){.motion-layout{grid-template-columns:minmax(0,1fr);padding:14px;gap:15px}.motion-preview{position:static;max-width:390px;width:100%;margin:auto}.motion-phone{height:600px}.motion-controls{min-width:0}#motionFields{gap:0 12px}.motion-field{grid-template-columns:minmax(0,1fr) 66px 20px}.motion-field input[type=number]{width:66px}}`;document.head.appendChild(style);
const $=s=>document.querySelector(s),box=$('#motionChat'),phone=$('#motionPhone'),status=$('#motionState');
fields.forEach(f=>{const row=document.createElement('div');row.className='motion-field';row.innerHTML=`<label for="motion-${f[0]}">${f[1]}</label><input type="range" id="motion-${f[0]}" min="${f[2]}" max="${f[3]}" step="${f[4]}" aria-label="${f[1]}"><input type="number" min="${f[2]}" max="${f[3]}" step="${f[4]}" aria-label="${f[1]}数值"><small>${f[6]}</small>`;const inputs=row.querySelectorAll('input');inputs.forEach(input=>{input.value=cfg[f[0]];input.oninput=()=>{if(input.value===''||!Number.isFinite(input.valueAsNumber))return;cfg[f[0]]=Math.min(f[3],Math.max(f[2],input.valueAsNumber));inputs.forEach(i=>i.value=cfg[f[0]]);apply();};});$('#motionFields').appendChild(row);});
function apply(){phone.classList.toggle('light',cfg.theme==='light');box.style.paddingBottom=cfg.bottomGap+'px';box.querySelectorAll('.motion-row').forEach(el=>el.style.margin=cfg.rowGap+'px 0');$('#motionTheme').value=cfg.theme;$('#motionEasing').value=cfg.easing;$('#motionEnabled').checked=cfg.enabled;}
function animate(el,from,duration,delay){if(!cfg.enabled||!el.animate)return;el.animate([from,{opacity:1,transform:'translateY(0) scale(1)'}],{duration,delay,easing:cfg.easing,fill:'backwards'});}
function push(start){cancelAnimationFrame(scrollFrame);const max=()=>Math.max(0,box.scrollHeight-box.clientHeight);if(!cfg.enabled||cfg.scrollDuration===0){box.scrollTop=max();return;}const token=generation,begin=performance.now()+cfg.scrollDelay,duration=cfg.scrollDuration,power=cfg.scrollPower;box.scrollTop=start;function step(now){if(token!==generation)return;const t=Math.max(0,Math.min(1,(now-begin)/duration));box.scrollTop=start+(max()-start)*(1-Math.pow(1-t,power));if(t<1)scrollFrame=requestAnimationFrame(step);}scrollFrame=requestAnimationFrame(step);}
['wheel','touchstart','pointerdown','keydown'].forEach(type=>box.addEventListener(type,()=>cancelAnimationFrame(scrollFrame),{passive:true}));
function add(text,mine,animated=true){const start=box.scrollTop,near=box.scrollHeight-box.clientHeight-start<75;const row=document.createElement('div');row.className='motion-row'+(mine?' mine':'');row.innerHTML='<div class="motion-avatar"></div><div class="motion-column"><div class="motion-bubble"></div><div class="motion-read"></div></div>';row.querySelector('.motion-avatar').textContent=mine?'我':'林';row.querySelector('.motion-bubble').textContent=text;row.style.margin=cfg.rowGap+'px 0';box.appendChild(row);if(animated){animate(row.querySelector('.motion-bubble'),{opacity:cfg.bubbleOpacity/100,transform:`translateY(${cfg.bubbleY}px) scale(${cfg.bubbleScale/100})`},cfg.bubbleDuration,cfg.sendDelay);animate(row.querySelector('.motion-avatar'),{opacity:0,transform:`translateY(${cfg.avatarY}px) scale(${cfg.avatarScale/100})`},cfg.avatarDuration,cfg.sendDelay+cfg.avatarDelay);if(mine||near)push(start);if(!mine)scheduleMessageRead(row,cfg.sendDelay);}return row;}
function time(animated=true){const el=document.createElement('div');el.className='motion-time';el.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});box.appendChild(el);if(animated)animate(el,{opacity:0,transform:`translateY(${cfg.timeY}px)`},cfg.timeDuration,cfg.timeDelay);}
function scheduleMessageRead(row,arrivalDelay){if(!row||row.dataset.read)return;row.dataset.read='pending';const token=generation,delay=(cfg.enabled?cfg.readDelay:0)+(arrivalDelay||0);row.dataset.readDueAt=String(Date.now()+delay);readTimers.push(setTimeout(()=>{if(token!==generation||!row.isConnected)return;row.dataset.read='yes';row.dataset.readShownAt=String(Date.now());const el=row.querySelector('.motion-read');el.innerHTML='<span>已</span><span>读</span>';[...el.children].forEach((char,i)=>animate(char,{opacity:0,transform:`translateY(${cfg.readY}px)`},cfg.readDuration,i*cfg.readSpacing));status.textContent='每条消息独立等待，再按先后顺序显示已读';},delay));}
function markRead(){const row=[...box.querySelectorAll('.motion-row.mine')].reverse().find(r=>!r.dataset.read);if(!row)return;status.textContent='这条演示消息已读到，独立等待已读字幕…';scheduleMessageRead(row,0);}

function replay(){generation++;readTimers.forEach(clearTimeout);readTimers=[];cancelAnimationFrame(scrollFrame);box.innerHTML='';time(false);const lines=['路上看到一小片晚霞。','是那种淡淡的粉色吗？','嗯，慢慢变成了蓝色。','好像连时间都慢了一点。','我刚把窗户打开。','那就听一会儿风吧。','今天没有什么急事。','嗯，我们慢慢聊。'];lines.forEach((s,i)=>add(s,i%2===1,false));box.scrollTop=box.scrollHeight;status.textContent='未读：不显示任何状态文字';const token=generation;readTimers.push(setTimeout(()=>{if(token!==generation)return;time();const sent=add($('#motionInput').value||'今天想慢一点。',true);readTimers.push(setTimeout(()=>{if(token!==generation)return;scheduleMessageRead(sent,0);add('好呀，我在。你慢慢说。',false);readTimers.push(setTimeout(()=>{if(token===generation)add('今天有什么想跟我说的吗？',false);},800));readTimers.push(setTimeout(()=>{if(token===generation)add('不着急，一句一句说。',false);},1600));},cfg.replyDelay));},350));}
$('#motionSend').onclick=()=>{const text=$('#motionInput').value.trim();if(!text)return;add(text,true);status.textContent='未读：不显示任何状态文字';};$('#motionRead').onclick=markRead;$('#motionReply').onclick=()=>{add('我在听，慢慢说就好。',false);};$('#motionReplay').onclick=replay;
$('#motionTheme').onchange=e=>{cfg.theme=e.target.value;apply();};$('#motionEasing').onchange=e=>cfg.easing=e.target.value;$('#motionEnabled').onchange=e=>cfg.enabled=e.target.checked;
function sync(){fields.forEach(f=>{$('#motion-'+f[0]).parentNode.querySelectorAll('input').forEach(i=>i.value=cfg[f[0]]);});apply();}
$('#motionSave').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(cfg));status.textContent='参数已保存，重新打开本页会恢复。';}catch(_){status.textContent='保存失败，请用导出参数复制保存。';}};
$('#motionReset').onclick=()=>{cfg=clean({});sync();replay();};$('#motionExport').onclick=()=>{$('#motionJSON').value=JSON.stringify(cfg,null,2);$('#motionJSON').parentNode.open=true;$('#motionJSON').select();status.textContent='参数已生成，可以复制给我。';};$('#motionImport').onclick=()=>{try{const next=clean(JSON.parse($('#motionJSON').value));cfg=next;sync();replay();}catch(_){status.textContent='JSON 格式不正确，当前参数已保留。';$('#motionJSON').parentNode.open=true;}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){generation++;readTimers.forEach(clearTimeout);readTimers=[];cancelAnimationFrame(scrollFrame);}});apply();replay();
const layoutStyle=document.createElement('style');layoutStyle.textContent="body:has(.motion-layout){height:100dvh;display:flex;flex-direction:column;overflow:hidden}body:has(.motion-layout)>.bar{position:static;flex-shrink:0;padding:12px 16px}.motion-layout{grid-template-columns:minmax(200px,390px) minmax(250px,650px);gap:20px;width:100%;max-width:1100px;margin:0 auto;padding:16px;flex:1;height:0;min-height:0;overflow:hidden}.motion-preview{position:static;top:auto;align-self:stretch;display:flex;flex-direction:column;height:100%;min-height:0;min-width:0;width:100%;margin:0}.motion-phone{height:auto;min-height:180px;flex:1;width:100%}.motion-controls{height:100%;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 10px 16px 0;scrollbar-gutter:stable}.motion-preview>p{font-size:12px;margin:4px 0}.motion-actions{flex-shrink:0;gap:6px;margin:10px 0 4px}.motion-actions button{font-size:12px;padding:8px}.motion-toolbar{margin-top:0}.motion-field{min-width:0}.motion-field label{grid-column:1/-1}.motion-field input[type=range]{min-width:0}#motionFields{grid-template-columns:minmax(0,1fr)}@media(min-width:1000px){#motionFields{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:850px){.motion-layout{grid-template-columns:minmax(200px,1fr) minmax(230px,1fr);padding:10px;gap:12px}.motion-phone{height:auto}.motion-preview>.sub{display:none}.motion-status{padding:10px 14px}.motion-chat{padding-left:8px;padding-right:8px}.motion-avatar{width:32px;height:32px;flex-basis:32px;font-size:16px}.motion-row{gap:6px}.motion-bubble{font-size:13px;padding:8px}.motion-field{grid-template-columns:minmax(0,1fr) 66px 22px}.motion-field input[type=number]{width:66px}}@media(max-width:480px){.motion-layout{grid-template-columns:minmax(140px,1fr) minmax(160px,1fr);padding:6px;gap:8px}.motion-controls{padding-right:3px}.motion-toolbar button{font-size:11px;padding:6px}.motion-selects{font-size:12px;gap:8px}.motion-field{grid-template-columns:minmax(0,1fr) 52px 20px}.motion-field input[type=number]{width:52px}.motion-composer{gap:4px;padding:6px}.motion-composer>span{display:none}.motion-composer button{padding:7px;font-size:12px}.motion-actions button{padding:5px;font-size:11px}.motion-nav{padding:0 10px}.motion-avatar{width:26px;height:26px;flex-basis:26px;font-size:13px}.motion-column{max-width:72%}}";document.head.appendChild(layoutStyle);
})();
}
