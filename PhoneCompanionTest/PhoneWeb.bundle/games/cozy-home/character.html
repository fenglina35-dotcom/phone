<aside id="panel"><a class="home" href="./">← 回到小家</a><h2>男主 · 捏脸</h2><div class="head-picker"><a data-head="base" href="./character.html">短发 · 原始款</a><a data-head="sakurada" href="./character.html?head=sakurada">中长发 · 温柔款</a></div><p class="subtle">先调轮廓，再看表情。改动自动保存在当前浏览器。</p><details><summary>查看你的角色参考</summary><img class="reference" src="assets/male-reference030.jpg" alt="黑发、黑色双排扣西装、酒红领带的男性角色全身参考"></details><h3>选择脸型起点</h3><p class="subtle">同一头模的不同轮廓预设，选好后继续自己捏。预设保留当前刘海、发色和瞳色。</p><div id="facePresets" class="choices"></div><button id="undoPreset" hidden>撤回上次预设 / 重置</button><div id="fields"></div><div class="colors"><label>头发 <input id="hair" type="color"></label><label>瞳色 <input id="iris" type="color"></label></div>
