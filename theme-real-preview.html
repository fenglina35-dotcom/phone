  document.title='小手机 · 互动动效体验';
  document.body.innerHTML=`<main class="shell-lab">
    <section class="shell-copy"><div class="shell-eyebrow"><i></i> 小手集 / INTERACTION STUDY 01</div>
      <h1>让每一次轻触，<br>都有<span>回响。</span></h1>
      <p class="shell-intro">内容保留动效，<br>标题不单独弹动。</p>
      <div class="shell-theme" aria-label="预览主题"><button data-theme="black" class="selected">墨黑</button><button data-theme="gray">雾白</button><button data-theme="pink">柔粉</button><button data-theme="blue">浅蓝</button></div>
      <label class="shell-app-picker">软件内页体验<select id="shellAppSelect"><option value="">选择软件</option><option value="douyin">抖音</option><option value="x">X</option><option value="phoneapp">电话</option><option value="album">相册</option><option value="tasks">任务便签</option><option value="roleplay">角色扮演</option><option value="travel">小鱼旅行</option><option value="wechat">微信</option><option value="settings">设置</option><option value="music">音乐</option><option value="worldbook">世界书</option><option value="browser">浏览器</option><option value="spy">查他手机</option><option value="shop">购物</option><option value="food">外卖</option><option value="couple">情侣空间</option><option value="games">游戏大厅</option><option value="mail">信箱</option><option value="offline">线下约会</option><option value="cinema">放映室</option><option value="calendar">日历</option><option value="pixelhome">像素少女</option><option value="pet">电子宠物</option></select></label>
      <div class="shell-studies"><button data-app="wechat"><em>01</em><span>打开微信<small>角色左滑 · 名字随页进入</small></span><b>↗</b></button><button data-app="settings"><em>02</em><span>走进设置<small>标题固定 · 开关滑动</small></span><b>↗</b></button><button data-app="music"><em>03</em><span>打开音乐<small>内容过渡 · 弹层浮现</small></span><b>↗</b></button><button data-action="modal"><em>04</em><span>试试弹窗<small>遮罩渐入 · 卡片轻轻落定</small></span><b>↗</b></button></div>
      <div class="shell-extra"><small>特殊页面也可以试试</small><button data-app="cinema">放映室</button><button data-app="pet">电子宠物</button><button data-app="games">游戏大厅</button><button data-action="image">图片查看</button><button data-action="lock">锁屏手势</button><button data-action="relationships">关系网</button><button data-action="moments">朋友圈</button></div>
      <div class="shell-note">直接点击右侧手机里的软件，也可以左右滑动主屏。<br>这是实际小手机页面，使用隔离示例数据。</div>
    </section>
    <section class="shell-stage"><div class="shell-halo"></div><div class="shell-device"><iframe id="shellPhone" title="小手机互动动效体验"></iframe></div><div class="shell-controls"><button data-action="back">← 返回一页</button><button data-action="home">⌂ 回主屏</button><a id="shellFullscreen" target="_blank">单独体验 ↗</a></div><div class="shell-caption"><i></i> 可自由操作 · 本地预览</div></section>
  </main>`;
  const style=document.createElement('style');style.textContent=`
    body{background:#eceee8;color:#25372e} .shell-lab{max-width:1160px;min-height:100dvh;margin:auto;display:grid;grid-template-columns:1fr 460px;gap:80px;padding:48px 52px;align-items:center;box-sizing:border-box}
    .shell-eyebrow{font-size:10px;letter-spacing:2.3px;display:flex;align-items:center;gap:9px;color:#66796a}.shell-eyebrow i,.shell-caption i{width:5px;height:5px;border-radius:50%;background:#68866a;display:inline-block}
    .shell-copy h1{font-family:ui-serif,"Songti SC",serif;font-size:clamp(34px,4.3vw,58px);line-height:1.3;font-weight:500;letter-spacing:-2px;margin:28px 0 22px}.shell-copy h1 span{color:#748d73}.shell-intro{font-size:14px;line-height:1.9;color:#7c877d;margin:0 0 26px}
    .shell-theme{display:flex;gap:7px;margin:0 0 30px}.shell-theme button{border:1px solid #d1d8ce;background:transparent;color:#738271;border-radius:30px;padding:7px 15px;font-size:11px;cursor:pointer;transition:background .2s,color .2s}.shell-theme button.selected{background:#344d3d;border-color:#344d3d;color:#fff}
    .shell-app-picker{display:flex;align-items:center;gap:12px;margin:-12px 0 22px;color:#63785f;font-size:11px}.shell-app-picker select{min-width:0;flex:1;border:1px solid #cbd4c5;border-radius:14px;background:transparent;padding:8px;color:#344d3d;font:12px system-ui}
    .shell-studies{border-top:1px solid #cfd6cc}.shell-studies button{display:flex;width:100%;align-items:center;gap:18px;border:0;border-bottom:1px solid #cfd6cc;background:transparent;padding:17px 0;text-align:left;color:#334c3c;cursor:pointer;transition:padding .25s}.shell-studies button:hover{padding-left:8px}.shell-studies em{font-size:10px;font-style:normal;color:#94a08f}.shell-studies span{font-size:15px;flex:1}.shell-studies small{display:block;font-size:10px;color:#90998a;margin-top:4px;letter-spacing:.4px}.shell-studies b{font-size:20px;font-weight:400;color:#8a9b85}.shell-note{font-size:11px;line-height:1.9;color:#939c8d;margin-top:26px}
    .shell-extra{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.shell-extra small{width:100%;color:#90998a;font-size:10px;margin-bottom:3px}.shell-extra button{border:1px solid #cbd4c5;border-radius:20px;background:transparent;color:#63785f;font:11px system-ui;padding:7px 11px;cursor:pointer}.shell-extra button:active{scale:.94}
    .shell-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}.shell-halo{position:absolute;inset:10% 0;background:radial-gradient(ellipse,#c2cebb80,transparent 67%);pointer-events:none}.shell-device{position:relative;height:min(780px,calc(100dvh - 156px));aspect-ratio:390/844;min-width:0;min-height:500px;border:7px solid #242b25;border-radius:42px;overflow:hidden;overflow:clip;box-shadow:0 35px 65px -30px #263d3b66,0 0 0 1px #70816c;background:#000;box-sizing:content-box}.shell-device iframe{display:block;width:100%;height:100%;border:0}.shell-controls{display:flex;align-items:center;gap:6px;position:relative}.shell-controls button,.shell-controls a{font:11px system-ui;color:#63785f;background:transparent;border:1px solid #cbd4c5;border-radius:20px;padding:7px 12px;cursor:pointer;text-decoration:none}.shell-controls button:active{transform:scale(.95)}.shell-caption{font-size:9px;letter-spacing:1.5px;color:#96a18f;display:flex;align-items:center;gap:7px}
    @media(max-width:850px){.shell-lab{gap:28px;padding:26px;grid-template-columns:1fr 360px}.shell-copy h1{font-size:38px}.shell-device{height:650px;min-height:0}}@media(max-width:650px){.shell-lab{display:flex;flex-direction:column;gap:30px;padding:30px 20px}.shell-copy{max-width:420px;width:100%}.shell-copy h1{font-size:42px;margin:20px 0 12px}.shell-intro{margin-bottom:16px}.shell-theme{margin-bottom:18px}.shell-studies{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.shell-studies button{gap:10px;padding:13px 0}.shell-studies small{font-size:9px}.shell-note{margin-top:15px}.shell-stage{width:100%}.shell-device{width:min(350px,calc(100vw - 64px));height:auto;aspect-ratio:390/844;border-radius:36px}}`;
  document.head.appendChild(style);
  const wxFocus=new URLSearchParams(location.search).get('focus')==='wechat';
  if(wxFocus){
    document.title='微信 · 专属互动体验';document.querySelector('.shell-eyebrow').innerHTML='<i></i> 小手集 / WECHAT INTERACTION 02';document.querySelector('.shell-copy h1').innerHTML='微信，也有<br>自己的<span>节奏。</span>';document.querySelector('.shell-intro').innerHTML='轻触、切换、展开、回到对话。<br>把最常打开的地方，做得更细腻。';
    document.querySelector('.shell-studies').innerHTML=[['chats','微信','轻触选中 · 图标回弹'],['contacts','通讯录','底栏不动 · 内容轻移'],['moments','发现','切换有方向 · 操作有回应'],['me','我','选中提示跟着手指走']].map((v,i)=>'<button data-wx-preview-tab="'+v[0]+'"><em>0'+(i+1)+'</em><span>'+v[1]+'<small>'+v[2]+'</small></span><b>↗</b></button>').join('');
    document.querySelector('.shell-extra').innerHTML='<small>继续试试常用操作</small><button data-action="wx-menu">右上角加号</button><button data-action="wx-chat">进入聊天</button><button data-action="wx-call-preview">通话动效</button><button data-action="wx-transfer">转账页面</button><button data-action="relationships">关系网</button><button data-action="moments">朋友圈</button><button data-action="modal">弹窗按钮</button>';
    document.querySelector('.shell-note').innerHTML='也可以直接操作右侧微信。灰白主题对应白天模式。<br>示例数据与正式存档隔离。';
  }
  const frame=document.querySelector('#shellPhone'),link=document.querySelector('#shellFullscreen');
  frame.style.cssText='width:390px;height:844px;transform-origin:0 0';
  const resizePreview=()=>{frame.style.transform='scale('+(frame.parentElement.clientWidth/390)+')';};
  if(typeof ResizeObserver==='function')new ResizeObserver(resizePreview).observe(frame.parentElement);else window.addEventListener('resize',resizePreview);resizePreview();
  function loadTheme(theme){const mode=wxFocus?theme+'-wechat-'+(theme==='gray'?'day':'night'):theme+'-home';const url='小手机.html?northPreview='+mode+'&motionPreview=shell';frame.src=url;link.href=url;}
  loadTheme('black');
  document.querySelector('#shellAppSelect').onchange=e=>{const w=frame.contentWindow,key=e.target.value;if(!key||!w||!w.__northBootReady)return;w.home();requestAnimationFrame(()=>w.appLaunch(key));};
  document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-theme]').forEach(n=>n.classList.toggle('selected',n===b));loadTheme(b.dataset.theme);});
  document.querySelectorAll('[data-wx-preview-tab]').forEach(b=>b.onclick=()=>{const w=frame.contentWindow;if(!w||!w.__northBootReady)return;const target=w.document.querySelector('[data-wx-tab="'+b.dataset.wxPreviewTab+'"]');if(target)target.click();else w.openWeChat(b.dataset.wxPreviewTab);});
  document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>{const w=frame.contentWindow;if(!w||!w.__northBootReady)return;w.home();requestAnimationFrame(()=>w.appLaunch(b.dataset.app));});
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const w=frame.contentWindow;if(!w||!w.__northBootReady)return;if(b.dataset.action==='home')w.home();else if(b.dataset.action==='back')w.back();else if(b.dataset.action==='wx-chat')w.openChat('preview_1');else if(b.dataset.action==='wx-call-preview'){w.wxInteractionPreviewCall();document.querySelector('.shell-caption').lastChild.textContent=' 通话动效演示 · 不会拨出电话';}else if(b.dataset.action==='wx-transfer'){w.wxInteractionPreviewCallEnd();w.openChat('preview_1');w.cTransfer('preview_1');document.querySelector('.shell-caption').lastChild.textContent=' 可自由操作 · 本地预览';}else if(b.dataset.action==='wx-menu'){const button=w.document.querySelector('.wx-main-add');if(!button||button.getAttribute('aria-expanded')==='false'&&!w.document.querySelector('[data-wx-tab="chats"].on'))w.openWeChat('chats');requestAnimationFrame(()=>{if(!w.document.querySelector('.wx-quick-menu'))w.toggleWxQuickMenu();});}else if(b.dataset.action==='relationships'){w.openWeChat('contacts');w.relOpen('');}else if(b.dataset.action==='moments'){w.openWeChat('moments');w.go('wxmoment');}else if(b.dataset.action==='lock')w.lockShow(true);else if(b.dataset.action==='image')w.viewImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#a5b69a"/><stop offset="1" stop-color="#283e35"/></linearGradient></defs><rect width="600" height="800" fill="url(#g)"/><circle cx="300" cy="340" r="130" fill="#e5e7d9" opacity=".8"/><path d="M0 660Q230 340 600 650V800H0Z" fill="#526c55"/></svg>'));else w.openModal('<h3>轻轻浮现，稳稳落下。</h3><p class="hint">现在可以点按下面的按钮，感受触按反馈和弹窗过渡。实际软件里的通用弹窗也会使用同样的节奏。</p><button class="btn p" onclick="closeModal()">感受到了</button>');});
}
</script>
</body>
</html>
